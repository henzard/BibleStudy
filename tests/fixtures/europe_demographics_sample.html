<h1>Europe's Growing Muslim Population</h1>
<p>Muslims made up about 4.9% of Europe's population in 2016, according to
the survey estimates — roughly 25.8 million Muslims across the region.</p>
<p>Under the high-migration scenario, the share could reach 14% by 2050;
with zero migration it would still rise modestly.</p>
